  <title>Blink Plans — icono de aplicación</title>
  <desc>Igual que el favicon pero a sangre (sin radio): iOS y Android recortan la máscara ellos solos, y un icono con esquinas ya redondeadas delataría la ventana sobre un papel que no es el suyo. El isotipo mantiene el mismo transform y la misma escala que blink-plans-favicon.svg, así que la marca tiene el mismo tamaño óptico en las dos familias de entregables.</desc>
